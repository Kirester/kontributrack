<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KontribuTrack - Officer Login">
  <title>KontribuTrack — Officer Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="brand-title">KontribuTrack</h1>
        <p class="brand-subtitle">Association Treasurer Portal</p>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="username">Officer Username</label>
          <input type="text" id="username" required autocomplete="username" placeholder="e.g. admin" autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-login">
          Log In to Portal
        </button>
      </form>

      <div id="login-alert" class="alert-msg"></div>

      <footer class="login-footer">
        <p>KontribuTrack — Secure Community Financial Tracking</p>
      </footer>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
